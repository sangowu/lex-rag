services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legal_rag_v1
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      # host 5432 被 rag_demo-postgres-1 占用；5433 被 paralegal-db-1 占用，故用 5434
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d legal_rag_v1"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "6800:6800"
    environment:
      - EMBED_API_KEY=${EMBED_API_KEY}
      - RERANK_API_KEY=${RERANK_API_KEY}
      - PG_PASSWORD=${PG_PASSWORD}
      - GENERATE_MODEL_API=${GENERATE_MODEL_API}
      - MINERU_API_TOKEN=${MINERU_API_TOKEN}
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
