[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-rag"
version = "0.1.0"
description = "Legal contract RAG pipeline with hybrid retrieval, reranking, contextual augmentation, and OCR (CUAD)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",          # OpenAI-compatible embedding API
    "datasets>=2.19",        # HuggingFace datasets (LegalBench)
    "pyyaml>=6.0",           # config.yaml parsing
    "python-dotenv>=1.0",    # .env loading
    "psycopg[binary]>=3.1",  # PostgreSQL driver
    "pgvector>=0.2",         # pgvector Python client
    "tqdm>=4.66",            # progress bars
    "numpy>=1.26",           # vector ops
    # OCR 评测的 CER/WER。此前只写在 CLAUDE.md 里让人手装，于是 eval_ocr.py /
    # 端到端 demo 在干净环境里第一步就 ModuleNotFoundError。
    "editdistance>=0.8",     # OCR CER/WER
    "pillow>=10.0",          # 合成扫描件渲染（scripts/make_scanned_demo.py）
    "ragas>=0.4.3",
    "fastapi>=0.115",             # REST API (scripts/serve.py)
    "uvicorn[standard]>=0.34",   # ASGI server (scripts/serve.py)
    "gradio>=4.44",               # Web UI (scripts/serve.py, mounted at /ui)
    "langfuse>=3.0",              # LLM 可观测性（失败安全，未配置则 no-op）
    "httpx>=0.27",                # MinerU 在线 API 客户端（lex_rag/ocr.py）
]

[project.scripts]
lex-rag = "lex_rag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lex_rag*"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest>=8.0",
]
