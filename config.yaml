embedding:
  provider: direct            # direct | ssh_tunnel | bge_http
  model: BAAI/bge-m3          # 1024 维，与 chunks.embedding vector(1024) 一致
  # SiliconFlow，OpenAI 兼容。**必须带 /v1**（OpenAI SDK 自己拼 /embeddings）。
  # 不要置空：空 base_url 会让 OpenAI SDK 回落到官方 api.openai.com，静默走错服务。
  base_url: https://api.siliconflow.cn/v1
  batch_size: 16
  max_retries: 2
  retry_backoff_sec: 1.0
  # SSH tunnel 参数（provider=ssh_tunnel 时生效）
  ssh_host: connect.westb.seetacloud.com       # 替换为实际服务器地址 ssh -p 25292 root@connect.westb.seetacloud.com
  ssh_user: root                # 替换为实际用户名
  ssh_port: 25292
  ssh_key_path:      # 替换为实际密钥路径
  ssh_local_port: 6006
  ssh_remote_host: 127.0.0.1
  ssh_remote_port: 1080

chunking:
  strategy: recursive         # fixed | recursive
  chunk_chars: 1000
  overlap: 100

retrieval:
  mode: hybrid                # vector | bm25 | hybrid
  top_k: 10
  rerank_top_k: 60            # 送入 reranker 的候选数（>= top_k）

reranker:
  enabled: false              # true 时 pipeline.query() 自动 rerank（或用 --reranker 覆盖）
  provider: direct            # direct(TEI 风格 /v1/rerank) | bge_http | macrolens
  model: BAAI/bge-reranker-v2-m3
  # SiliconFlow，与 embedding 同一 host。写不写结尾的 /v1 都可以：
  # reranker.py 自己拼 /v1/rerank，多余的 /v1 会被容错去掉。
  # 认证用 .env 的 RERANK_API_KEY，未设置则回落到 EMBED_API_KEY。
  base_url: https://api.siliconflow.cn/v1
  # 与 rerank_top_k 对齐，让一次查询只打一个 rerank 请求。
  # 原值 8 是本地 8GB 显存 GPU 时期的显存约束；换成托管 API 后每查询要打 8 次
  # 往返，实测 10.3 s/条，改成 60 后单请求约 2s。
  batch_size: 60
  # 重试窗口按指数退避展开：1s -> 2s -> 4s -> 8s，各带 [0.5,1.5) 倍抖动。
  # 4 次重试把窗口拉到 13~28s。原来是固定 1.0s，实测失败查询中位只熬了 8.45s，
  # 服务端抖动超过 8.5 秒就整条 error 掉（见 docs/experiments.md）。
  max_retries: 4
  retry_backoff_sec: 1.0

database:
  host: localhost
  port: 5434                   # lex_rag 自己的 docker pgvector（5432 被 rag_demo、5433 被 paralegal 占用）
  name: legal_rag_v1
  user: rag
  table: chunks                # 切换到 chunks_contextual 可对比 contextual RAG 效果

evaluation:
  k_values: [1, 3, 5, 10]
  scope: contract             # contract | corpus
  mode: span                  # span | containment

# 生成层 + 所有辅助 LLM 任务（contextual / HyDE / multi-query / meta 提取 / 查询重写）共用这一节。
# enabled 只控制 ingest 阶段的 Contextual RAG；生成、HyDE 等不看这个字段。
contextual:
  enabled: false              # true 时 ingest 阶段为每个 chunk 调用 LLM 生成上下文前缀
  model: qwen3.7-flash
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1   # DashScope，OpenAI 兼容
  # thinking 在 deepseek 上是净收益：横评里误拒从 0.50 降到 0.20，判别力 J 从
  # 0.50 升到 0.80（data/runs/bakeoff/20260825T174242Z.json）。代价是延迟从
  # 1.8s 涨到 9.4s。注意这个结论是模型相关的——同一开关在 qwen3.7-plus 上是负收益。
  thinking: true
  rpm_limit: 120               # 控制 API 调用频率
  max_retries: 3
  retry_backoff_sec: 2.0      # 指数退避基数（秒）
  section_chars: 3000         # HierarchicalContextualizer 的 section 切分大小

hyde:
  enabled: false              # true 时 query 阶段先用 LLM 生成假设合同条款再 embed（复用 contextual 配置）

multi_query:
  enabled: false              # true 时将问题改写为 N 个变体，多路检索后 RRF 合并（复用 contextual 配置）
  n: 3                        # 含原始问题在内的总查询数

parent_child:
  parent_chars: 1000          # parent chunk 大小（与 chunk_chars 对齐）
  child_chars: 300             # child chunk 大小（用于检索）
  overlap: 50                  # child 之间的 overlap

ragas:
  # judge 刻意用与生成层不同家族的模型，避免自评偏袒
  model: qwen3.7-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  thinking: false
  rpm_limit: 60                  # RAGAS 每轮评估会多次调用 LLM，注意限速
