embedding:
  provider: direct            # direct | ssh_tunnel | bge_http
  model: BAAI/bge-m3          # 1024 维，与 chunks.embedding vector(1024) 一致
  # SiliconFlow，OpenAI 兼容。**必须带 /v1**（OpenAI SDK 自己拼 /embeddings）。
  # 不要置空：空 base_url 会让 OpenAI SDK 回落到官方 api.openai.com，静默走错服务。
  base_url: https://api.siliconflow.cn/v1
  batch_size: 16
  max_retries: 2
  retry_backoff_sec: 1.0
  # SSH tunnel 参数（provider=ssh_tunnel 时生效）
  ssh_host: connect.westb.seetacloud.com       # 替换为实际服务器地址 ssh -p 25292 root@connect.westb.seetacloud.com
  ssh_user: root                # 替换为实际用户名
  ssh_port: 25292
  ssh_key_path:      # 替换为实际密钥路径
  ssh_local_port: 6006
  ssh_remote_host: 127.0.0.1
  ssh_remote_port: 1080

chunking:
  strategy: recursive         # fixed | recursive
  chunk_chars: 1000
  overlap: 100

retrieval:
  mode: hybrid                # vector | bm25 | hybrid
  # 原值 10。281 条有答案样本里，gold 被 rerank 排在第 9~20 名的有 15 条——
  # top_k=10 时这 15 条的正确片段根本到不了生成层。配对实测（同一批样本、
  # 8 条上下文 vs 20 条上下文）：救回 6 条、零丢失；gold 本来就在前 8 名的
  # 30 条对照组是 1 赚 1 亏，多给 12 个干扰项没有可测的伤害。
  # 全库净效应 +6/281 = +2.1 个点。
  # 名次分布 [9,9,10,10,11,11,13,15,18,18,19,19,19,20,20] 没有拐点，
  # 取 12 只覆盖 40%、取 15 覆盖 53%，所以是 20 而不是更小的数。
  top_k: 20
  # ⚠️ 名字有坑：这是送**进** reranker 的候选数（代码里叫 fetch_k），
  # 不是 reranker 返回的条数——返回条数是上面的 top_k。
  # 所以 top_k 10→20 只是"60 进 20 出"，发给 reranker 的 token 一个没多，
  # TPM 零增长；而动这一行（60→200）会把 TPM 从 88% 推到 143%。
  rerank_top_k: 60            # 送入 reranker 的候选数（>= top_k）

reranker:
  # 2026-08-29 由 false 改 true。原值 false 造成一处静默的不一致：
  # 各评测脚本都靠 `--reranker` 打开它（`if args.reranker: enabled=True`，只加不减），
  # 于是文档里**所有**基线数字都是开着 reranker 测的；而 serve.py 从不覆盖这个字段，
  # 线上问答就一直走在没被评测过的那一档上。
  # 更糟的是 strategy.py 里 `fetch_k = rerank_top_k if rerank_on else top_k`——
  # 不开 rerank 时候选池直接从 60 塌到 20，线上连候选都比评测时少。
  # 代价：每查询多一次 rerank 往返；TPM 配额是账号级的，见下面 tpm_limit。
  # 由 tests/test_serve_defaults.py 钉住"线上跑的就是被评测的那条配置"。
  enabled: true               # pipeline.query() 自动 rerank（--reranker 现在是 no-op）
  provider: direct            # direct(TEI 风格 /v1/rerank) | bge_http | macrolens
  model: BAAI/bge-reranker-v2-m3
  # SiliconFlow，与 embedding 同一 host。写不写结尾的 /v1 都可以：
  # reranker.py 自己拼 /v1/rerank，多余的 /v1 会被容错去掉。
  # 认证用 .env 的 RERANK_API_KEY，未设置则回落到 EMBED_API_KEY。
  base_url: https://api.siliconflow.cn/v1
  # 与 rerank_top_k 对齐，让一次查询只打一个 rerank 请求。
  # 原值 8 是本地 8GB 显存 GPU 时期的显存约束；换成托管 API 后每查询要打 8 次
  # 往返，实测 10.3 s/条，改成 60 后单请求约 2s。
  batch_size: 60
  # 重试窗口按指数退避展开：1s -> 2s -> 4s -> 8s，各带 [0.5,1.5) 倍抖动。
  # 4 次重试把窗口拉到 13~28s。原来是固定 1.0s，实测失败查询中位只熬了 8.45s，
  # 服务端抖动超过 8.5 秒就整条 error 掉（见 docs/experiments.md）。
  max_retries: 4
  retry_backoff_sec: 1.0
  # 客户端限速：贴着服务商的 TPM 上限跑，而不是去撞它再退避。
  # SiliconFlow 的 reranker 档位是扁平的 RPM 2000 / TPM 500000（不随消费等级变）。
  # 实测一轮 1000 条语料：RPM 58（上限的 2.9%，完全不是瓶颈），TPM 440132（88%）。
  # 88% 是均值——按合同算瞬时速率，25 份合同里 11 份超上限，最高 906K（181%）。
  # 这里留 10% 余量。0 = 关闭限速。
  tpm_limit: 450000

database:
  host: localhost
  port: 5434                   # lex_rag 自己的 docker pgvector（5432 被 rag_demo、5433 被 paralegal 占用）
  name: legal_rag_v1
  user: rag
  table: chunks                # 切换到 chunks_contextual 可对比 contextual RAG 效果

evaluation:
  k_values: [1, 3, 5, 10]
  scope: contract             # contract | corpus
  mode: span                  # span | containment

# 生成层 + 所有辅助 LLM 任务（contextual / HyDE / multi-query / meta 提取 / 查询重写）共用这一节。
# enabled 只控制 ingest 阶段的 Contextual RAG；生成、HyDE 等不看这个字段。
contextual:
  enabled: false              # true 时 ingest 阶段为每个 chunk 调用 LLM 生成上下文前缀
  model: qwen3.7-flash
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1   # DashScope，OpenAI 兼容
  # ⚠️ 这个字段不只喂生成层：SufficiencyJudge、StrategySelector、HyDE、
  # 元数据抽取、查询扩展全都读它（都走 ChatClient.from_config(cfg.contextual)）。
  # 改它是一次多组件改动，不是单变量。
  #
  # 2026-08-28 由 true 改 false，依据是 200 条配对 A/B（同一批样本按 id 配对，
  # 只差这一个字段，run 20260828T194756Z vs 20260828T195620Z）：
  #   延迟      7927ms -> 896ms，200/200 条全部更快，逐条之差中位 -6.1s
  #   编造(FP)  16/150 -> 11/150
  #   误拒(FN)   1/50  ->  4/50
  #   J          0.873 ->  0.847
  # J 的差 0.026 与**同配置跑两遍**的差 0.026 一样大（A 复本 191840Z: J=0.847），
  # 也就是质量差异测不出来，而延迟差 9 倍。两个指标各自都不显著
  # （p=0.180 / 0.375），方向相反且互相抵消。
  #
  # 拒答门总错 17 -> 15，且错误偏向"拒答"而不是"编造"——法务场景里这是安全的
  # 那一侧，产品决策就按这条定的。
  #
  # ⚠️ 作废一条旧结论：文档里"关掉 thinking 会让 J 从 0.60 掉到 0.40"是 10 条
  # 横评的产物，在 200 条配对上不成立。
  thinking: false
  rpm_limit: 120               # 控制 API 调用频率
  max_retries: 3
  retry_backoff_sec: 2.0      # 指数退避基数（秒）
  section_chars: 3000         # HierarchicalContextualizer 的 section 切分大小

hyde:
  enabled: false              # true 时 query 阶段先用 LLM 生成假设合同条款再 embed（复用 contextual 配置）

multi_query:
  enabled: false              # true 时将问题改写为 N 个变体，多路检索后 RRF 合并（复用 contextual 配置）
  n: 3                        # 含原始问题在内的总查询数

parent_child:
  parent_chars: 1000          # parent chunk 大小（与 chunk_chars 对齐）
  child_chars: 300             # child chunk 大小（用于检索）
  overlap: 50                  # child 之间的 overlap

ragas:
  # judge 刻意用与生成层不同家族的模型，避免自评偏袒
  model: qwen3.7-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  thinking: false
  rpm_limit: 60                  # RAGAS 每轮评估会多次调用 LLM，注意限速
